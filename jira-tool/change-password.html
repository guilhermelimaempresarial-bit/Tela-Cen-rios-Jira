<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jira Tool V2 - Mudar Senha</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      width: min(500px, 90vw);
      background: #111827;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    h1 { margin: 0; font-size: 1.8rem; }
    .header a { color: #93c5fd; text-decoration: none; font-weight: 600; font-size: 0.9rem; }
    .header a:hover { color: #60a5fa; }
    label { display: block; margin-top: 16px; font-size: 0.9rem; color: #cbd5e1; }
    input { width: 100%; margin-top: 6px; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; }
    input:focus { border-color: #2563eb; outline: none; }
    button { width: 100%; margin-top: 24px; padding: 12px; border: none; border-radius: 8px; background: #2563eb; color: white; font-weight: 700; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #64748b; cursor: not-allowed; }
    .message { margin-top: 16px; font-size: 0.9rem; padding: 12px; border-radius: 8px; }
    .error { background: #7f1d1d; color: #fca5a5; border: 1px solid #991b1b; }
    .success { background: #166534; color: #86efac; border: 1px solid #15803d; }
    .muted { font-size: 0.8rem; color: #64748b; margin-top: 4px; }
    .alert { background: #1e3a8a; border: 1px solid #3b82f6; border-radius: 8px; padding: 12px; margin-top: 16px; color: #93c5fd; font-size: 0.9rem; }
    .alert strong { display: block; margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔐 Mudar Senha</h1>
      <a href="/profile.html">← Voltar</a>
    </div>

    <div class="alert">
      <strong>⚠️ Segurança:</strong>
      Use uma senha forte com números, letras maiúsculas, minúsculas e caracteres especiais.
    </div>

    <label for="senhaAtual">Senha Atual</label>
    <input type="password" id="senhaAtual" placeholder="Digite sua senha atual" />

    <label for="novaSenha">Nova Senha</label>
    <input type="password" id="novaSenha" placeholder="Digite uma nova senha" />

    <label for="confirmarSenha">Confirmar Nova Senha</label>
    <input type="password" id="confirmarSenha" placeholder="Confirme a nova senha" />
    <p class="muted">As duas senhas devem ser iguais.</p>

    <button id="btnMudar" onclick="mudarSenha()">Mudar Senha</button>

    <div id="message" class="message" style="display:none;"></div>
  </div>

  <script>
    const messageDiv = document.getElementById('message');

    function showMessage(text, type = 'info') {
      messageDiv.textContent = text;
      messageDiv.className = `message ${type}`;
      messageDiv.style.display = 'block';
    }

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('forced') === '1') {
      document.querySelector('.header a').style.display = 'none';
      document.querySelector('.alert').innerHTML = '<strong>⚠️ Ação Necessária:</strong><br/>Este é o seu primeiro acesso. Você é obrigado a alterar a senha gerada automaticamente para continuar.';
    }

    async function mudarSenha() {
      const senhaAtual = document.getElementById('senhaAtual').value;
      const novaSenha = document.getElementById('novaSenha').value;
      const confirmarSenha = document.getElementById('confirmarSenha').value;

      if (!senhaAtual || !novaSenha || !confirmarSenha) {
        showMessage('Todos os campos são obrigatórios.', 'error');
        return;
      }

      if (novaSenha.length < 6) {
        showMessage('A nova senha deve ter pelo menos 6 caracteres.', 'error');
        return;
      }

      if (novaSenha !== confirmarSenha) {
        showMessage('As novas senhas não coincidem.', 'error');
        return;
      }

      document.getElementById('btnMudar').disabled = true;

      try {
        const resp = await fetch('/api/auth/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            currentPassword: senhaAtual,
            newPassword: novaSenha,
          }),
        });

        const result = await resp.json();

        if (!resp.ok) {
          showMessage(result.error || 'Erro ao mudar senha.', 'error');
          return;
        }

        showMessage('✓ Senha alterada com sucesso!', 'success');
        document.getElementById('senhaAtual').value = '';
        document.getElementById('novaSenha').value = '';
        document.getElementById('confirmarSenha').value = '';

        setTimeout(() => {
          window.location.href = '/profile.html';
        }, 1500);
      } catch (error) {
        showMessage('Erro ao mudar senha. Tente novamente.', 'error');
        console.error(error);
      } finally {
        document.getElementById('btnMudar').disabled = false;
      }
    }
  </script>
</body>
</html>
