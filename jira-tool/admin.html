<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administração - Jira Tool</title>
  <style>
    :root {
      --bg: #fafbfc;
      --surface: #ffffff;
      --surface-2: #f4f5f7;
      --surface-3: #ebecf0;
      --text: #172b4d;
      --text-strong: #091e42;
      --text-muted: #5e6c84;
      --text-soft: #6b778c;
      --border: #dfe1e6;
      --border-input: #c1c7d0;
      --shadow: rgba(9,30,66,0.08);
      --accent: #0052cc;
      --danger: #d32f2f;
      --success: #15803d;
      --warning: #b45309;
    }
    [data-theme="dark"] {
      --bg: #0d1117;
      --surface: #161b22;
      --surface-2: #21262d;
      --surface-3: #2d333b;
      --text: #e6edf3;
      --text-strong: #ffffff;
      --text-muted: #9198a1;
      --text-soft: #8b949e;
      --border: #30363d;
      --border-input: #3d444d;
      --shadow: rgba(0,0,0,0.4);
      --accent: #4c9aff;
      --danger: #f87171;
      --success: #4ade80;
      --warning: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem;
      transition: background-color 0.2s, color 0.2s;
    }
    .container {
      max-width: 1600px; /* Aumentamos o limite máximo de 1100px para 1600px */
      width: 100%;       /* Garante que ocupe todo o espaço disponível até o limite */
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 1px 3px var(--shadow);
      padding: 24px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .header h1 {
      font-size: 1.7rem;
      color: var(--text-strong);
    }
    .header-right {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.7rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border-input);
      background: var(--surface-2);
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .btn.primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .btn.danger {
      background: var(--danger);
      border-color: var(--danger);
      color: white;
    }
    .subtitle {
      color: var(--text-muted);
      margin-top: 6px;
      font-size: 0.9rem;
    }
    .alert {
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 18px;
      display: none;
      font-size: 0.9rem;
    }
    .alert.error {
      background: rgba(220, 38, 38, 0.08);
      color: #991b1b;
      border: 1px solid rgba(220, 38, 38, 0.2);
      display: block;
    }
    .alert.success {
      background: rgba(34, 197, 94, 0.08);
      color: #166534;
      border: 1px solid rgba(34, 197, 94, 0.2);
      display: block;
    }
    [data-theme="dark"] .alert.error {
      background: rgba(127, 29, 29, 0.4);
      color: #fca5a5;
      border-color: rgba(153, 27, 27, 0.6);
    }
    [data-theme="dark"] .alert.success {
      background: rgba(22, 101, 52, 0.4);
      color: #86efac;
      border-color: rgba(21, 128, 61, 0.8);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 18px;
      overflow: hidden;
      border-radius: 10px;
    }
    th, td {
      text-align: left;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      font-size: 0.9rem;
    }
    th {
      background: var(--surface-2);
      color: var(--text-strong);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    td {
      background: var(--surface);
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
      border: 1px solid transparent;
    }
    .badge.mfa-on {
      background: rgba(34, 197, 94, 0.12);
      color: var(--success);
      border-color: rgba(34, 197, 94, 0.25);
    }
    .badge.mfa-off {
      background: rgba(148, 163, 184, 0.15);
      color: var(--text-muted);
      border-color: rgba(148, 163, 184, 0.3);
    }
    .badge.role-admin {
      background: rgba(230, 73, 128, 0.12);
      color: #be185d;
      border-color: rgba(190, 24, 93, 0.25);
    }
    .badge.role-qa {
      background: rgba(59, 130, 246, 0.12);
      color: #1d4ed8;
      border-color: rgba(59, 130, 246, 0.25);
    }
    .badge.status-active {
      background: rgba(34, 197, 94, 0.12);
      color: var(--success);
      border-color: rgba(34, 197, 94, 0.25);
    }
    .badge.status-blocked {
      background: rgba(220, 38, 38, 0.12);
      color: var(--danger);
      border-color: rgba(220, 38, 38, 0.25);
    }
    .small-action {
      padding: 0.5rem 0.75rem;
      font-size: 0.8rem;
      border-radius: 6px;
      border: 1px solid var(--border-input);
      background: var(--surface-2);
      color: var(--text);
      cursor: pointer;
    }
    .small-action.danger {
      background: rgba(220, 38, 38, 0.1);
      border-color: rgba(220, 38, 38, 0.25);
      color: var(--danger);
    }
    .small-action.success {
      background: rgba(34, 197, 94, 0.12);
      border-color: rgba(34, 197, 94, 0.25);
      color: var(--success);
    }
    .empty {
      text-align: center;
      color: var(--text-muted);
      padding: 24px;
      background: var(--surface-2);
      border: 1px dashed var(--border-input);
      border-radius: 8px;
      margin-top: 16px;
    }
    @media (max-width: 760px) {
      body { padding: 1rem; }
      .container { padding: 18px; }
      table, thead, tbody, th, td, tr { display: block; }
      thead { display: none; }
      tr { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; background: var(--surface); }
      td { border: none; border-bottom: 1px solid var(--border); }
      td:last-child { border-bottom: none; }
    }
  </style>
  <script>
    (function() {
      try {
        const saved = localStorage.getItem('jiraTool.theme') || 'light';
        document.documentElement.setAttribute('data-theme', saved);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>🛡️ Administração</h1>
        <p class="subtitle">Controle de usuários e MFA do sistema</p>
      </div>
      <div class="header-right">
        <a class="btn" href="/">Voltar para o início</a>
        <button class="btn primary" type="button" onclick="abrirModalCriarUsuario()">+ Novo Usuário</button>
        <button class="btn primary" type="button" onclick="carregarUsuarios()">Atualizar</button>
      </div>
    </div>

    <div id="alert" class="alert"></div>

    <div id="modalCriarUsuario" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
      <div style="background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:24px; max-width:500px; width:90%;">
        <h2 style="color:var(--text-strong); margin-bottom:16px;">Criar Novo Usuário</h2>
        
        <div id="modalAlert" class="alert" style="margin-bottom:16px;"></div>

        <div style="display:flex; flex-direction:column; gap:12px;">
          <div>
            <label style="display:block; color:var(--text-strong); font-weight:600; margin-bottom:6px; font-size:0.9rem;">Nome *</label>
            <input id="formName" type="text" placeholder="Nome completo" style="width:100%; padding:10px; border:1px solid var(--border-input); border-radius:6px; background:var(--surface-2); color:var(--text); font-size:0.9rem;">
          </div>

          <div>
            <label style="display:block; color:var(--text-strong); font-weight:600; margin-bottom:6px; font-size:0.9rem;">Username *</label>
            <input id="formUsername" type="text" placeholder="nome.usuario" style="width:100%; padding:10px; border:1px solid var(--border-input); border-radius:6px; background:var(--surface-2); color:var(--text); font-size:0.9rem;">
          </div>

          <div>
            <label style="display:block; color:var(--text-strong); font-weight:600; margin-bottom:6px; font-size:0.9rem;">Email Jira *</label>
            <input id="formJiraEmail" type="email" placeholder="jira@company.com" style="width:100%; padding:10px; border:1px solid var(--border-input); border-radius:6px; background:var(--surface-2); color:var(--text); font-size:0.9rem;">
          </div>

          <div>
            <label style="display:block; color:var(--text-strong); font-weight:600; margin-bottom:6px; font-size:0.9rem;">Domínio Jira (opcional)</label>
            <input id="formJiraDomain" type="text" placeholder="company.atlassian.net" value="nimbi-portal.atlassian.net" style="width:100%; padding:10px; border:1px solid var(--border-input); border-radius:6px; background:var(--surface-2); color:var(--text); font-size:0.9rem;">
          </div>

          <p style="color:var(--text-muted); font-size:0.85rem; margin:8px 0;">
            ⚠️ O usuário será criado <strong>bloqueado</strong> e só poderá acessar após você desbloqueá-lo.
          </p>
        </div>

        <div style="display:flex; gap:8px; margin-top:20px; justify-content:flex-end;">
          <button class="btn" type="button" onclick="fecharModalCriarUsuario()">Cancelar</button>
          <button class="btn primary" type="button" onclick="criarNovoUsuario()">Criar Usuário</button>
        </div>
      </div>
    </div>
      <table>
        <thead>
          <tr>
            <th>Usuário</th>
            <th>Role</th>
            <th>Status</th>
            <th>MFA</th>
            <th>Cadastro</th>
            <th>Bloqueio</th>
            <th>Ação MFA</th>
            <th>Senha</th>
          </tr>
        </thead>
        <tbody id="usersTableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const alertBox = document.getElementById('alert');
    const tableBody = document.getElementById('usersTableBody');

    function setAlert(message, type = 'success') {
      alertBox.textContent = message;
      alertBox.className = `alert ${type}`;
    }

    function formatDate(dateStr) {
      if (!dateStr) return '-';
      const d = new Date(dateStr);
      return d.toLocaleDateString('pt-BR', {
        day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
      });
    }

    async function carregarUsuarios() {
      try {
        const resp = await fetch('/api/admin/users');
        const result = await resp.json();

        if (!resp.ok) {
          setAlert(result.error || 'Erro ao carregar usuários.', 'error');
          return;
        }

        tableBody.innerHTML = '';

        if (!result.users || result.users.length === 0) {
          tableBody.innerHTML = '<tr><td colspan="6"><div class="empty">Nenhum usuário cadastrado.</div></td></tr>';
          return;
        }

        for (const user of result.users) {
          const blocked = Boolean(user.loginBlocked);
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>
              <div style="font-weight:700;">${user.name || '-'}</div>
              <div style="color: var(--text-muted); margin-top:4px;">${user.username || '-'}</div>
            </td>
            <td><span class="badge role-${user.role === 'admin' ? 'admin' : 'qa'}">${user.role === 'admin' ? 'Admin' : 'QA'}</span></td>
            <td><span class="badge ${blocked ? 'status-blocked' : 'status-active'}">${blocked ? 'Bloqueado' : 'Ativo'}</span></td>
            <td><span class="badge ${user.mfaEnabled ? 'mfa-on' : 'mfa-off'}">${user.mfaEnabled ? 'Ativado' : 'Desativado'}</span></td>
            <td>${formatDate(user.createdAt)}</td>
            <!-- Coluna 1: Bloqueio -->
            <td>
              <button class="small-action ${blocked ? 'success' : 'danger'}" type="button" onclick="toggleBloqueioUsuario('${user.id}', ${blocked})">${blocked ? 'Desbloquear' : 'Bloquear'}</button>
            </td>
            <!-- Coluna 2: Ação MFA -->
            <td>
              ${user.mfaEnabled 
                ? `<button class="small-action danger" type="button" onclick="desativarMfa('${user.id}')">Desativar MFA</button>` 
                : `<button class="small-action" style="background: var(--surface-3); border-color: var(--border-input); color: var(--text-muted); cursor: not-allowed;" type="button" disabled>MFA Desativado</button>`}
            </td>
            <!-- Coluna 3: Senha -->
            <td>
              <button class="small-action warning" style="background: rgba(180, 83, 9, 0.1); border-color: rgba(180, 83, 9, 0.25); color: var(--warning);" type="button" onclick="resetarSenhaUsuario('${user.id}', '${user.name}')">Resetar Senha</button>
            </td>
          `;
          tableBody.appendChild(row);
        }
      } catch (error) {
        setAlert('Erro ao carregar usuários.', 'error');
        console.error(error);
      }
    }

    async function desativarMfa(userId) {
      const confirmed = window.confirm('Deseja realmente desativar o MFA deste usuário?');
      if (!confirmed) return;

      try {
        const resp = await fetch(`/api/admin/users/${userId}/mfa`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mfaEnabled: false })
        });

        const result = await resp.json();
        if (!resp.ok) {
          setAlert(result.error || 'Erro ao desativar MFA.', 'error');
          return;
        }

        setAlert('MFA desativado com sucesso.', 'success');
        await carregarUsuarios();
      } catch (error) {
        setAlert('Erro ao desativar MFA.', 'error');
        console.error(error);
      }
    }

      async function toggleBloqueioUsuario(userId, currentlyBlocked) {
      const action = currentlyBlocked ? 'desbloquear' : 'bloquear';
      const confirmed = window.confirm(`Deseja realmente ${action} este usuário?`);
      if (!confirmed) return;

      try {
        const resp = await fetch(`/api/admin/users/${userId}/status`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ loginBlocked: !currentlyBlocked })
        });

        const result = await resp.json();
        if (!resp.ok) {
          setAlert(result.error || 'Erro ao atualizar status do usuário.', 'error');
          return;
        }

        setAlert(`Usuário ${!currentlyBlocked ? 'bloqueado' : 'desbloqueado'} com sucesso.`, 'success');
        await carregarUsuarios();
      } catch (error) {
        setAlert('Erro ao atualizar status do usuário.', 'error');
        console.error(error);
      }
    }

    async function resetarSenhaUsuario(userId, userName) {
      const confirmed = window.confirm(`Deseja realmente RESETAR a senha do usuário ${userName}? \nUma nova senha será gerada e o usuário terá que trocá-la no próximo acesso.`);
      if (!confirmed) return;

      try {
        const resp = await fetch(`/api/admin/users/${userId}/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });

        const result = await resp.json();
        if (!resp.ok) {
          setAlert(result.error || 'Erro ao resetar senha.', 'error');
          return;
        }

        const senha = result.tempPassword || 'NÃO LOCALIZADA';
        
        // Exibe a nova senha com destaque
        alertBox.style.display = 'block';
        alertBox.className = 'alert success';
        alertBox.innerHTML = `
          <p style="font-family: system-ui, sans-serif; font-size: 14px; color: var(--text); margin: 8px 0;">
            🔑 Senha de <strong style="color: var(--text-strong);">${userName}</strong> resetada para: <code style="background: var(--surface-2); color: var(--text-strong); padding: 2px 6px; border-radius: 4px; font-weight: bold;">${senha}</code> <span style="color: var(--text-muted); font-size: 12px;">(troca obrigatória no login)</span>
          </p>
        `;
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
        await carregarUsuarios();
      } catch (error) {
        setAlert('Erro ao resetar senha.', 'error');
        console.error(error);
      }
    }

    function abrirModalCriarUsuario() {
      document.getElementById('modalCriarUsuario').style.display = 'flex';
      document.getElementById('formName').value = '';
      document.getElementById('formUsername').value = '';
      document.getElementById('formJiraEmail').value = '';
      document.getElementById('formJiraEmail').value = '';
      document.getElementById('formJiraDomain').value = 'nimbi-portal.atlassian.net';
      document.getElementById('modalAlert').className = 'alert';
      document.getElementById('modalAlert').textContent = '';
    }

    function fecharModalCriarUsuario() {
      document.getElementById('modalCriarUsuario').style.display = 'none';
    }

    function setModalAlert(message, type = 'success') {
      const modal = document.getElementById('modalAlert');
      modal.textContent = message;
      modal.className = `alert ${type}`;
    }

    async function criarNovoUsuario() {
      const name = document.getElementById('formName').value.trim();
      const username = document.getElementById('formUsername').value.trim();
      const jiraEmail = document.getElementById('formJiraEmail').value.trim();
      const jiraDomain = document.getElementById('formJiraDomain').value.trim();

      if (!name || !username || !jiraEmail) {
        setModalAlert('Nome, username e Email do Jira são obrigatórios.', 'error');
        return;
      }



            try {
        const resp = await fetch('/api/admin/users/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name,
            username,
            jiraEmail: jiraEmail || '',
            jiraDomain: jiraDomain || 'nimbi-portal.atlassian.net',
          })
        });

        const result = await resp.json();
        console.log('RESPOSTA SERVIDOR:', result);

        if (!resp.ok) {
          setModalAlert(result.error || 'Erro ao criar usuário.', 'error');
          return;
        }

        // Busca a senha em qualquer lugar do objeto
        const senha = result.tempPassword || (result.user && result.user.tempPassword) || 'NÃO LOCALIZADA';
        
        fecharModalCriarUsuario();
        
        // Alerta visual na tela principal
        alertBox.style.display = 'block';
        alertBox.className = 'alert success';
        alertBox.innerHTML = `
          <div style="padding: 10px; border-radius: 8px;">
            <h3 style="margin-bottom: 8px; color: var(--success);">✅ Usuário Criado com Sucesso!</h3>
            Senha de <strong style="color: var(--text-strong);">${name}</strong> criada: <code style="background: var(--surface-2); color: var(--text-strong); padding: 2px 6px; border-radius: 4px; font-weight: bold;">${senha}</code> <span style="color: var(--text-muted); font-size: 12px;">(troca obrigatória no login)</span>
            <p style="margin-top: 10px; font-size: 0.85rem; color: var(--text-muted);">⚠️ Copie esta senha agora. Ela não será exibida novamente após atualizar a página.</p>
          </div>
        `;
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
        await carregarUsuarios();
      } catch (error) {
        setModalAlert('Erro ao criar usuário.', 'error');
        console.error(error);
      }
    }

    async function verificarAdmin() {
      try {
        const resp = await fetch('/api/auth/session');
        const result = await resp.json();
        if (!result.authenticated) {
          window.location.href = '/login.html';
          return;
        }
        if (result.user.role !== 'admin') {
          window.location.href = '/';
          return;
        }
        await carregarUsuarios();
      } catch (error) {
        window.location.href = '/login.html';
      }
    }

    document.addEventListener('DOMContentLoaded', verificarAdmin);
  </script>
</body>
</html>
