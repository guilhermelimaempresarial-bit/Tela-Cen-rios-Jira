<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jira Tool V2 - Login</title>
  <style>
    :root {
      --bg: #fafbfc;
      --surface: #ffffff;
      --surface-2: #f4f5f7;
      --surface-3: #ebecf0;
      --text: #172b4d;
      --text-strong: #091e42;
      --text-muted: #5e6c84;
      --text-soft: #6b778c;
      --border: #dfe1e6;
      --border-input: #c1c7d0;
      --code-bg: #dfe1e6;
      --shadow: rgba(9,30,66,0.08);
      --accent: #0052cc;
    }
    [data-theme="dark"] {
      --bg: #0d1117;
      --surface: #161b22;
      --surface-2: #21262d;
      --surface-3: #2d333b;
      --text: #e6edf3;
      --text-strong: #ffffff;
      --text-muted: #9198a1;
      --text-soft: #8b949e;
      --text-label: #c9d1d9;
      --border: #30363d;
      --border-input: #3d444d;
      --code-bg: #2d333b;
      --shadow: rgba(0,0,0,0.4);
      --accent: #4c9aff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 1800px;
      width: 100%;
      margin: 0 auto;
      padding: 0 2rem;
      color: var(--text);
      background-color: var(--bg);
      transition: background-color 0.2s, color 0.2s;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header { 
      margin-bottom: 2rem;
      margin-top: 2rem;
      padding-bottom: 1.5rem;
    }
    .header-top { 
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      flex-wrap: wrap;
    }
    h1 { 
      font-size: 1.6rem;
      color: var(--text-strong);
      font-weight: 700;
    }
    p.subtitle { 
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 0.2rem;
    }
    .theme-toggle { 
      margin-top: 0;
      padding: 0.5rem 1rem;
      background: var(--surface-2);
      color: var(--text-muted);
      border: 1px solid var(--border-input);
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.2s;
      text-decoration: none;
      display: inline-block;
    }
    .theme-toggle:hover { background: var(--surface-3); }
    .theme-toggle-btn {
      background: none;
      border: none;
      padding: 0.5rem 1rem;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.2s;
    }
    .theme-toggle-btn:hover { background: var(--surface-2); border-radius: 20px; }
    .login-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1;
      margin-bottom: 2rem;
    }
    .container {
      width: min(460px, 90vw);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 1px 3px var(--shadow);
    }
    label { 
      display: block;
      font-weight: 600;
      margin-top: 1rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    input {
      width: 100%;
      padding: 0.6rem;
      margin-top: 0.3rem;
      border: 1px solid var(--border-input);
      border-radius: 4px;
      font-size: 0.875rem;
      background: var(--bg);
      color: var(--text);
      transition: border-color 0.2s, background-color 0.2s;
    }
    input:focus { 
      border-color: #4c9aff;
      background: var(--surface);
      outline: none;
      box-shadow: 0 0 0 2px rgba(76,154,255,0.2);
    }
    button.primary {
      width: 100%;
      margin-top: 1.5rem;
      padding: 0.75rem 1.8rem;
      background: #0052cc;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button.primary:hover { background: #0065ff; }
    button.primary:disabled { background: #a5adba; cursor: not-allowed; }
    button.secondary { 
      background: var(--surface-2);
      color: var(--text-muted);
      border: 1px solid var(--border-input);
      margin-top: 0.8rem;
    }
    button.secondary:hover { background: var(--surface-3); }
    .muted { 
      color: var(--text-muted);
      font-size: 0.82rem;
    }
    .message { 
      margin-top: 12px;
      font-size: 0.9rem;
      min-height: 20px;
      padding: 12px;
      border-radius: 6px;
      display: none;
    }
    .message.error { 
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
      display: block;
    }
    [data-theme="dark"] .message.error {
      background: #7f1d1d;
      color: #fca5a5;
      border: 1px solid #991b1b;
    }
    .message.success { 
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
      display: block;
    }
    [data-theme="dark"] .message.success {
      background: #166534;
      color: #86efac;
      border: 1px solid #15803d;
    }
    @media (max-width: 768px) {
      body { padding: 0 1rem; margin: 0; }
      .header-top { flex-direction: column; }
      header { margin-top: 1rem; margin-bottom: 1rem; }
    }
  </style>
  <script>
    (function() {
      try {
        const saved = localStorage.getItem('jiraTool.theme') || 'light';
        document.documentElement.setAttribute('data-theme', saved);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header>
    <div class="header-top">
      <div>
        <h1>🔐 Jira Tool V2</h1>
        <p class="subtitle">Automação segura de cenários de teste no Jira com autenticação por usuário</p>
      </div>
      <div style="display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap;">
        <a class="theme-toggle" href="login-help.html" target="_blank" title="Abrir guia de uso" style="text-decoration:none;">❓ Como usar</a>
        <button class="theme-toggle-btn" id="themeToggle" onclick="toggleTheme()" title="Alternar tema claro/escuro">🌙 Tema escuro</button>
      </div>
    </div>
  </header>

  <div class="login-container">
    <div class="container">
      <h1 id="formTitle" style="font-size: 1.4rem; margin-bottom: 0.5rem;">Login</h1>
      <p class="muted" id="formSubtitle">Acesse sua conta para usar a ferramenta</p>
      
      <div id="registerFields" style="display:none;">
        <label for="name">Nome</label>
        <input id="name" type="text" placeholder="Seu nome completo" />
      </div>
      
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="seu.email@empresa.com" />
      
      <label for="password">Senha</label>
      <input id="password" type="password" placeholder="Sua senha" />
      
      <div id="registerExtra" style="display:none;">
        <label for="jiraEmail">Email Jira</label>
        <input id="jiraEmail" type="email" placeholder="seu.email@empresa.com" />
        <p class="muted">Email que você usa na API do Jira</p>
        
        <label for="jiraToken">Token Jira</label>
        <input id="jiraToken" type="password" placeholder="Seu token da API do Jira" />
        <p class="muted">Gere em: https://id.atlassian.com/manage-profile/security/api-tokens</p>
        
        <label for="jiraDomain">Domínio Jira</label>
        <input id="jiraDomain" type="text" value="nimbi-portal.atlassian.net" placeholder="ex: nimbi-portal.atlassian.net" />
        <p class="muted">Deixe em branco para usar o padrão</p>
      </div>
      
      <button class="primary" id="submitBtn" onclick="submitForm()">Entrar</button>
      <button class="secondary" id="toggleBtn" onclick="toggleMode()">Quero me cadastrar</button>
      
      <div id="message" class="message"></div>
    </div>
  </div>

  <script>
    let isRegister = false;

    function updateThemeButton() {
      const atual = document.documentElement.getAttribute('data-theme') || 'light';
      const btn = document.getElementById('themeToggle');
      if (btn) btn.textContent = atual === 'dark' ? '☀️ Tema claro' : '🌙 Tema escuro';
    }

    function toggleTheme() {
      const atual = document.documentElement.getAttribute('data-theme') || 'light';
      const novo = atual === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', novo);
      try { localStorage.setItem('jiraTool.theme', novo); } catch (e) {}
      updateThemeButton();
    }

    function setMessage(text, type = '') {
      const el = document.getElementById('message');
      el.textContent = text;
      el.className = 'message ' + (type ? type : '');
      el.style.display = text ? 'block' : 'none';
    }

    function toggleMode() {
      isRegister = !isRegister;
      document.getElementById('registerFields').style.display = isRegister ? 'block' : 'none';
      document.getElementById('registerExtra').style.display = isRegister ? 'block' : 'none';
      document.getElementById('formTitle').textContent = isRegister ? 'Cadastro' : 'Login';
      document.getElementById('formSubtitle').textContent = isRegister ? 'Crie sua conta para começar a usar' : 'Acesse sua conta para usar a ferramenta';
      document.getElementById('submitBtn').textContent = isRegister ? 'Cadastrar' : 'Entrar';
      document.getElementById('toggleBtn').textContent = isRegister ? 'Já tenho conta' : 'Quero me cadastrar';
      setMessage('');
    }

    async function submitForm() {
      const payload = {
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      };

      if (isRegister) {
        payload.name = document.getElementById('name').value.trim();
        payload.jiraEmail = document.getElementById('jiraEmail').value.trim();
        payload.jiraToken = document.getElementById('jiraToken').value.trim();
        payload.jiraDomain = document.getElementById('jiraDomain').value.trim();
      }

      if (!payload.email || !payload.password) {
        setMessage('Email e senha são obrigatórios.', 'error');
        return;
      }

      if (isRegister && (!payload.name || !payload.jiraEmail || !payload.jiraToken)) {
        setMessage('Todos os campos de cadastro são obrigatórios.', 'error');
        return;
      }

      const endpoint = isRegister ? '/api/auth/register' : '/api/auth/login';
      
      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();
        if (!response.ok) {
          setMessage(result.error || 'Falha ao processar autenticação.', 'error');
          return;
        }

        setMessage(isRegister ? 'Cadastro realizado! Redirecionando...' : 'Login bem-sucedido! Redirecionando...', 'success');
        setTimeout(() => window.location.href = '/', 800);
      } catch (error) {
        setMessage('Erro de conexão. Tente novamente.', 'error');
        console.error(error);
      }
    }

    document.getElementById('password').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') submitForm();
    });

    document.addEventListener('DOMContentLoaded', updateThemeButton);
  </script>
</body>
</html>
