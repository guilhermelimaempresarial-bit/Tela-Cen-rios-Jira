<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jira Tool V2 - Mudar Senha</title>
  
  <!-- Importa nosso CSS Global -->
  <link rel="stylesheet" href="style.css" />
  
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      width: min(460px, 90vw);
    }
    .alert-box { 
      background: var(--surface-2); 
      border: 1px solid var(--border); 
      border-left: 4px solid var(--accent);
      border-radius: 6px; 
      padding: 12px; 
      margin-top: 16px; 
      color: var(--text); 
      font-size: 0.9rem; 
    }
    .message { 
      margin-top: 16px; font-size: 0.9rem; padding: 12px; border-radius: 6px; display: none; 
    }
    .error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .success { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    [data-theme="dark"] .error { background: #7f1d1d; color: #fca5a5; border: 1px solid #991b1b; }
    [data-theme="dark"] .success { background: #166534; color: #86efac; border: 1px solid #15803d; }
  </style>
  
  <script>
    (function() {
      try {
        const saved = localStorage.getItem('jiraTool.theme') || 'light';
        document.documentElement.setAttribute('data-theme', saved);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="container card">
    <div class="header-top">
      <div>
        <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem;">🔐 Mudar Senha</h1>
      </div>
      <a href="/profile.html" class="theme-toggle" id="linkVoltar" style="text-decoration:none;">← Voltar</a>
    </div>

    <div class="alert-box" id="alertBox">
      <strong style="color: var(--text-strong);">⚠️ Segurança:</strong><br>
      Use uma senha forte com números, letras maiúsculas, minúsculas e caracteres especiais.
    </div>

    <label for="senhaAtual">Senha Atual</label>
    <input type="password" id="senhaAtual" placeholder="Digite sua senha atual" />

    <label for="novaSenha">Nova Senha</label>
    <input type="password" id="novaSenha" placeholder="Digite uma nova senha" />

    <label for="confirmarSenha">Confirmar Nova Senha</label>
    <input type="password" id="confirmarSenha" placeholder="Confirme a nova senha" />
    <p class="hint">As duas senhas devem ser iguais.</p>

    <button id="btnMudar" class="primary" style="width: 100%;" onclick="mudarSenha()">Mudar Senha</button>

    <div id="message" class="message"></div>
  </div>

  <script>
    const messageDiv = document.getElementById('message');

    function showMessage(text, type = 'info') {
      messageDiv.textContent = text;
      messageDiv.className = `message ${type}`;
      messageDiv.style.display = 'block';
    }

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('forced') === '1') {
      document.getElementById('linkVoltar').style.display = 'none';
      document.getElementById('alertBox').innerHTML = '<strong style="color: var(--text-strong);">⚠️ Ação Necessária:</strong><br/>Este é o seu primeiro acesso. Você é obrigado a alterar a senha gerada automaticamente para continuar.';
    }

    async function mudarSenha() {
      const senhaAtual = document.getElementById('senhaAtual').value;
      const novaSenha = document.getElementById('novaSenha').value;
      const confirmarSenha = document.getElementById('confirmarSenha').value;

      if (!senhaAtual || !novaSenha || !confirmarSenha) {
        showMessage('Todos os campos são obrigatórios.', 'error');
        return;
      }

      if (novaSenha.length < 6) {
        showMessage('A nova senha deve ter pelo menos 6 caracteres.', 'error');
        return;
      }

      if (novaSenha !== confirmarSenha) {
        showMessage('As novas senhas não coincidem.', 'error');
        return;
      }

      document.getElementById('btnMudar').disabled = true;

      try {
        const resp = await fetch('/api/auth/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            currentPassword: senhaAtual,
            newPassword: novaSenha,
          }),
        });

        const result = await resp.json();

        if (!resp.ok) {
          showMessage(result.error || 'Erro ao mudar senha.', 'error');
          document.getElementById('btnMudar').disabled = false;
          return;
        }

        showMessage('✓ Senha alterada com sucesso!', 'success');
        document.getElementById('senhaAtual').value = '';
        document.getElementById('novaSenha').value = '';
        document.getElementById('confirmarSenha').value = '';

        setTimeout(() => {
          window.location.href = '/profile.html';
        }, 1500);
      } catch (error) {
        showMessage('Erro ao mudar senha. Tente novamente.', 'error');
        console.error(error);
        document.getElementById('btnMudar').disabled = false;
      } 
    }
  </script>
</body>
</html>
