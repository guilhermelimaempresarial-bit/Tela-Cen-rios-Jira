<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Como usar — Jira Cenários Tool</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Estilos extras para o conteúdo Markdown */
    body { max-width: 900px; margin: 0 auto; line-height: 1.6; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1.5rem; margin-top: 2rem;}
    #conteudo h1 { font-size: 1.8rem; }
    #conteudo h2 { font-size: 1.25rem; margin-top: 2.2rem; border-bottom: 2px solid var(--border); padding-bottom: 0.3rem; }
    #conteudo a { color: var(--accent); }
    #conteudo code { background: var(--code-bg); padding: 2px 6px; border-radius: 4px; font-size: 0.88em; font-family: monospace; }
    #conteudo pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; overflow-x: auto; }
    #conteudo table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    #conteudo th, #conteudo td { border: 1px solid var(--border); padding: 0.5rem 0.75rem; text-align: left; }
    #conteudo th { background: var(--surface-2); }
    #conteudo blockquote { border-left: 4px solid var(--accent); background: var(--surface-2); margin: 1rem 0; padding: 0.5rem 1rem; border-radius: 6px; }
  </style>
  <script>
    (function(){ try { document.documentElement.setAttribute('data-theme', localStorage.getItem('jiraTool.theme') || 'light'); } catch(e){} })();
    function alternarTema(){
      const atual = document.documentElement.getAttribute('data-theme') || 'light';
      const novo = atual === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', novo);
      try { localStorage.setItem('jiraTool.theme', novo); } catch(e){}
      document.getElementById('btnTema').textContent = novo === 'dark' ? '☀️ Tema claro' : '🌙 Tema escuro';
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
</head>
<body>

<div class="topbar">
  <a class="theme-toggle" style="text-decoration:none;" href="index.html">← Voltar para a ferramenta</a>
  <button class="theme-toggle" id="btnTema" onclick="alternarTema()">🌙 Tema escuro</button>
</div>

<div id="conteudo"><p class="hint">Carregando guia…</p></div>

<script>
  document.getElementById('btnTema').textContent = (document.documentElement.getAttribute('data-theme') === 'dark') ? '☀️ Tema claro' : '🌙 Tema escuro';
  fetch('GUIA-QA.md?t=' + Date.now())
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(md => {
      document.getElementById('conteudo').innerHTML = marked.parse(md);
      document.querySelectorAll('#conteudo a[href^="http"]').forEach(a => { a.target = '_blank'; });
    })
    .catch(err => {
      document.getElementById('conteudo').innerHTML = '<p class="hint">❌ Erro ao carregar: ' + err.message + '</p>';
    });
</script>
</body>
</html>
