<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Como usar — Jira Cenários Tool</title>
  <style>
    :root {
      --bg: #fafbfc; --surface: #ffffff; --surface-2: #f4f5f7; --text: #172b4d;
      --text-strong: #091e42; --text-muted: #5e6c84; --border: #dfe1e6; --accent: #0052cc; --code-bg: #eef1f5;
    }
    [data-theme="dark"] {
      --bg: #0d1117; --surface: #161b22; --surface-2: #21262d; --text: #e6edf3;
      --text-strong: #ffffff; --text-muted: #9198a1; --border: #30363d; --accent: #4c9aff; --code-bg: #21262d;
    }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem 4rem; color: var(--text); background: var(--bg); line-height: 1.6; transition: background-color .2s, color .2s; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
    .btn { padding: 0.5rem 1rem; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 20px; font-weight: 600; font-size: 0.82rem; cursor: pointer; text-decoration: none; white-space: nowrap; }
    .btn:hover { filter: brightness(1.05); }

    /* Conteúdo renderizado do markdown */
    #conteudo h1 { color: var(--text-strong); font-size: 1.8rem; }
    #conteudo h2 { color: var(--text-strong); font-size: 1.25rem; margin-top: 2.2rem; border-bottom: 2px solid var(--border); padding-bottom: 0.3rem; }
    #conteudo h3 { color: var(--text-strong); font-size: 1.02rem; margin-top: 1.4rem; }
    #conteudo p, #conteudo li { color: var(--text); }
    #conteudo a { color: var(--accent); }
    #conteudo code { background: var(--code-bg); padding: 2px 6px; border-radius: 4px; font-size: 0.88em; font-family: ui-monospace, Consolas, monospace; }
    #conteudo pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; overflow-x: auto; }
    #conteudo pre code { background: none; padding: 0; font-size: 0.85rem; line-height: 1.45; }
    #conteudo table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    #conteudo th, #conteudo td { border: 1px solid var(--border); padding: 0.5rem 0.75rem; text-align: left; font-size: 0.92rem; }
    #conteudo th { background: var(--surface-2); color: var(--text-strong); }
    #conteudo blockquote { border-left: 4px solid var(--accent); background: var(--surface-2); margin: 1rem 0; padding: 0.5rem 1rem; border-radius: 6px; color: var(--text-muted); }
    #conteudo hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
    .status-msg { color: var(--text-muted); font-size: 0.9rem; }
  </style>
  <script>
    (function(){ try { document.documentElement.setAttribute('data-theme', localStorage.getItem('jiraTool.theme') || 'light'); } catch(e){} })();
    function alternarTema(){
      var atual = document.documentElement.getAttribute('data-theme') || 'light';
      var novo = atual === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', novo);
      try { localStorage.setItem('jiraTool.theme', novo); } catch(e){}
      document.getElementById('btnTema').textContent = novo === 'dark' ? '☀️ Tema claro' : '🌙 Tema escuro';
    }
  </script>
  <!-- Renderizador de Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
</head>
<body>

<div class="topbar">
  <a class="btn" href="index.html">← Voltar para a ferramenta</a>
  <button class="btn" id="btnTema" onclick="alternarTema()">🌙 Tema escuro</button>
</div>

<div id="conteudo"><p class="status-msg">Carregando guia…</p></div>

<div class="topbar" style="margin-top:2rem;">
  <a class="btn" href="index.html">← Voltar para a ferramenta</a>
</div>

<script>
  document.getElementById('btnTema').textContent =
    (document.documentElement.getAttribute('data-theme') === 'dark') ? '☀️ Tema claro' : '🌙 Tema escuro';

  // Lê o markdown (fonte única) e renderiza. Adiciona ?t= para evitar cache antigo.
  fetch('GUIA-QA.md?t=' + Date.now())
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function(md){
      document.getElementById('conteudo').innerHTML = marked.parse(md);
      // Abre links externos em nova aba
      document.querySelectorAll('#conteudo a[href^="http"]').forEach(function(a){ a.target = '_blank'; a.rel = 'noopener'; });
    })
    .catch(function(err){
      document.getElementById('conteudo').innerHTML =
        '<p class="status-msg">❌ Não foi possível carregar o guia (' + err.message + ').<br>' +
        'Verifique se o arquivo <code>GUIA-QA.md</code> está na pasta <code>public</code>.</p>';
    });
</script>

</body>
</html>
